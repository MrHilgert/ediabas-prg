# eDIAG — ECU / .prg strings, German → English.
# Strings out of a BMW SGBD (.prg) or INPA .ipo (German source).
# Format: <deutsch> = <english>.  Unlisted German strings pass through unchanged.

# --- Screen / menu titles ---
Fehlerspeicher   = Fault memory
Identifikation   = Identification
Messwerte        = Measured values
Stellglieder     = Actuators
Codierung        = Coding
Systemtest       = System test

# --- Common measurement labels (DDE diesel) ---
Motordrehzahl        = Engine speed
Kühlmitteltemperatur = Coolant temperature
Motortemperatur      = Engine temperature
Ansauglufttemperatur = Intake air temperature
Öltemperatur         = Oil temperature
Ladedruck            = Boost pressure
Raildruck            = Rail pressure
Luftmasse            = Air mass flow
Batteriespannung     = Battery voltage
Fahrgeschwindigkeit  = Vehicle speed

# --- Fault names / freeze-frame labels (E39: DDE4, IKE/KOMBI, LCM) ---
Fehler aufgetreten bei = Fault occurred at
Unbekannt = Unknown
Unbekannter Fehlerort = Unknown fault location
DDE-Hauptrelais = DDE main relay
Empfangsfehler ASC4 = Reception error ASC4
Gate - Array Kommunikation unentprellt = Gate-array communication (undebounced)
Gong_1 = Gong 1
Gong_2 = Gong 2
Gong_3 = Gong 3
IKE-EEPROM-Fehler, Codierung fehlerhaft/unvollstaendig = IKE EEPROM error, coding faulty/incomplete
Klemme R = Terminal R
Korrektur der Haupteinspritzung zu spät = Main injection correction too late
Kurzschluss in Kuehlwasserheizung = Short circuit in coolant heater
Unterbrechung in Kuehlwasserheizung = Open circuit in coolant heater
Ladelufttemperaturfuehler T21 = Charge-air temperature sensor T21
Leerlauf-Testimpuls-Fehler = Idle test-pulse error
Lichtmodul-EEPROM-Fehler = Light module EEPROM error
Luftmasse unplausibel hoch = Air mass implausibly high
MIL OFF = MIL off
Oeldruck = Oil pressure
Oeltemperatur = Oil temperature
Raildruck aendert sich zu schnell = Rail pressure changes too fast
Raildruck nicht plausibel = Rail pressure not plausible
Raildruck passt nicht zu Ansteuerungstastverhaeltnis = Rail pressure does not match control duty cycle
Raildrucksensor Offset-Test = Rail pressure sensor offset test
SIA-Reset = SIA reset (service interval)
SRC Spannung zu hoch = SRC voltage too high
SRC Spannung zu niedrig = SRC voltage too low
Serielles Telegramm fuer Tacho, DZM, KVA, Tank, Temp. = Serial telegram for speedo, tacho, KVA, fuel, temp.
Signal AGS : Telegrammfehler oder kein Telegramm = Signal AGS: telegram error or no telegram
Signal KVA1 = Signal KVA1
Signal KVA2 = Signal KVA2
Signal TD (Drehzahl) = Signal TD (speed)
Signal TWEG+ (Tacho) = Signal TWEG+ (speedo)
Tacho A = Speedometer A
Tank-Hebelgeber_1 = Fuel level sender 1
Tank-Hebelgeber_2 = Fuel level sender 2
Ueberspannung (U>16V) = Overvoltage (U>16V)
Uebertemperaturerkennung2 = Overtemperature detection 2
Uebertemperaturerkennung3 = Overtemperature detection 3
Blockiererkennung2 = Blockage detection 2
Blockiererkennung3 = Blockage detection 3
Vorfoerderdruck im Leerlauf zu niedrig = Pre-supply pressure at idle too low
Vorfoerderdruck zu niedrig = Pre-supply pressure too low
