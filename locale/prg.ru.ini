# eDIAG — ECU / .prg strings, German → Russian.
# These are strings that come out of a BMW SGBD (.prg) or INPA .ipo, whose source
# language is German. Format: <deutsch> = <перевод>.  A line split on the FIRST '='.
# Any German string not listed here is shown as-is (passthrough), so this file can
# grow gradually. Keys must match the German source exactly (case-sensitive).

# --- Screen / menu titles ---
Fehlerspeicher   = Память ошибок
Identifikation   = Идентификация
Messwerte        = Измеряемые величины
Stellglieder     = Исполнительные механизмы
Codierung        = Кодирование
Systemtest       = Тест системы

# --- Common measurement labels (DDE diesel) ---
Motordrehzahl        = Обороты двигателя
Kühlmitteltemperatur = Температура ОЖ
Motortemperatur      = Температура двигателя
Ansauglufttemperatur = Температура воздуха на впуске
Öltemperatur         = Температура масла
Ladedruck            = Давление наддува
Raildruck            = Давление в топливной рампе
Luftmasse            = Массовый расход воздуха
Batteriespannung     = Напряжение АКБ
Fahrgeschwindigkeit  = Скорость автомобиля

# --- Fault names / freeze-frame labels (E39: DDE4, IKE/KOMBI, LCM) ---
Fehler aufgetreten bei = Неисправность возникла при пробеге
Unbekannt = Неизвестно
Unbekannter Fehlerort = Неизвестное место неисправности
DDE-Hauptrelais = Главное реле DDE
Empfangsfehler ASC4 = Ошибка приёма ASC4
Gate - Array Kommunikation unentprellt = Связь Gate-Array (без подавления дребезга)
Gong_1 = Гонг 1
Gong_2 = Гонг 2
Gong_3 = Гонг 3
IKE-EEPROM-Fehler, Codierung fehlerhaft/unvollstaendig = Ошибка EEPROM IKE, кодирование неверно/неполно
Klemme R = Клемма R
Korrektur der Haupteinspritzung zu spät = Коррекция основного впрыска слишком поздно
Kurzschluss in Kuehlwasserheizung = Короткое замыкание в подогревателе ОЖ
Unterbrechung in Kuehlwasserheizung = Обрыв в подогревателе ОЖ
Ladelufttemperaturfuehler T21 = Датчик температуры наддувочного воздуха T21
Leerlauf-Testimpuls-Fehler = Ошибка тестового импульса холостого хода
Lichtmodul-EEPROM-Fehler = Ошибка EEPROM модуля света
Luftmasse unplausibel hoch = Массовый расход воздуха недостоверно высок
MIL OFF = MIL выкл
Oeldruck = Давление масла
Oeltemperatur = Температура масла
Raildruck aendert sich zu schnell = Давление в рампе меняется слишком быстро
Raildruck nicht plausibel = Давление в рампе недостоверно
Raildruck passt nicht zu Ansteuerungstastverhaeltnis = Давление в рампе не соответствует скважности управления
Raildrucksensor Offset-Test = Тест смещения датчика давления в рампе
SIA-Reset = Сброс SIA (сервисного интервала)
SRC Spannung zu hoch = SRC: напряжение слишком высокое
SRC Spannung zu niedrig = SRC: напряжение слишком низкое
Serielles Telegramm fuer Tacho, DZM, KVA, Tank, Temp. = Последовательная телеграмма для спидометра, тахометра, KVA, бака, темп.
Signal AGS : Telegrammfehler oder kein Telegramm = Сигнал AGS: ошибка телеграммы или нет телеграммы
Signal KVA1 = Сигнал KVA1
Signal KVA2 = Сигнал KVA2
Signal TD (Drehzahl) = Сигнал TD (обороты)
Signal TWEG+ (Tacho) = Сигнал TWEG+ (спидометр)
Tacho A = Спидометр A
Tank-Hebelgeber_1 = Датчик уровня топлива 1
Tank-Hebelgeber_2 = Датчик уровня топлива 2
Ueberspannung (U>16V) = Перенапряжение (U>16В)
Uebertemperaturerkennung2 = Распознавание перегрева 2
Uebertemperaturerkennung3 = Распознавание перегрева 3
Blockiererkennung2 = Распознавание блокировки 2
Blockiererkennung3 = Распознавание блокировки 3
Vorfoerderdruck im Leerlauf zu niedrig = Давление подкачки на холостом ходу слишком низкое
Vorfoerderdruck zu niedrig = Давление подкачки слишком низкое
